<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11151d">
  <title>배뽑디 - 2Way 뽑기 디펜스</title>
  <style>
    :root {
      --bg: #10131a;
      --panel: #181e29;
      --panel2: #202838;
      --line: #334054;
      --ink: #f7f9ff;
      --muted: #aab5c7;
      --coin: #ffd460;
      --red: #ff5c70;
      --blue: #62b9ff;
      --green: #67df8d;
      --purple: #bb7cff;
      --shadow: 0 20px 70px rgba(0, 0, 0, .34);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 0%, rgba(255, 92, 112, .16), transparent 28%),
        radial-gradient(circle at 80% 3%, rgba(98, 185, 255, .14), transparent 30%),
        linear-gradient(145deg, #10131a, #141a24 54%, #10141d);
      overflow-x: hidden;
    }

    button {
      border: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .app {
      width: min(1280px, 100%);
      margin: 0 auto;
      min-height: 100vh;
      padding: max(12px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 12px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 44px);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .hud {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .pill, .btn {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .12);
      background: rgba(24, 30, 41, .9);
      box-shadow: 0 9px 22px rgba(0, 0, 0, .2);
      font-weight: 900;
      white-space: nowrap;
    }

    .btn.primary {
      color: #231906;
      border-color: rgba(255, 212, 96, .45);
      background: linear-gradient(135deg, #ffe085, #ff9f52);
    }

    .btn.blue {
      color: #061622;
      background: linear-gradient(135deg, #62b9ff, #67df8d);
    }

    .btn.red {
      background: linear-gradient(135deg, #ff5c70, #bb7cff);
    }

    .btn.active {
      outline: 3px solid rgba(255, 255, 255, .85);
      outline-offset: -4px;
      background: linear-gradient(135deg, #ff5c70, #ff9f52);
      color: #fff;
    }

    .status {
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 9px 12px;
      border: 1px solid rgba(255, 212, 96, .34);
      border-radius: 8px;
      background: linear-gradient(90deg, rgba(255, 212, 96, .12), rgba(98, 185, 255, .1), rgba(103, 223, 141, .1));
      color: #fff3c1;
      text-align: center;
      font-weight: 900;
    }

    .battlefield {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      min-height: 0;
    }

    .lane {
      position: relative;
      min-height: 520px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(32, 40, 56, .95), rgba(20, 25, 35, .95));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .lane-head {
      position: absolute;
      z-index: 5;
      left: 12px;
      right: 12px;
      top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      pointer-events: none;
    }

    .lane canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .slots {
      position: absolute;
      z-index: 4;
      display: grid;
    }

    #mobSlots {
      inset: 24% 10%;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 5px;
    }

    #bossSlots {
      inset: 24% 24%;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .slot {
      position: relative;
      min-width: 0;
      border-radius: 8px;
      border: 2px dashed rgba(255, 255, 255, .22);
      background: rgba(10, 14, 21, .38);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .slot.ready {
      border-color: rgba(98, 185, 255, .9);
      box-shadow: inset 0 0 0 2px rgba(98, 185, 255, .18), 0 0 18px rgba(98, 185, 255, .2);
    }

    .slot.selected {
      border-style: solid;
      border-color: #fff;
      animation: pulse .75s ease-in-out infinite;
    }

    .sell-mode .slot,
    .sell-mode .bench-card {
      border-color: rgba(255, 92, 112, .9);
    }

    @keyframes pulse {
      50% { filter: brightness(1.35); }
    }

    .unit {
      position: relative;
      width: min(64px, 82%);
      aspect-ratio: 1;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .45);
      display: grid;
      place-items: center;
      font-weight: 1000;
      font-size: clamp(20px, 3.2vw, 32px);
      text-shadow: 0 2px 10px rgba(0, 0, 0, .45);
    }

    .unit::after {
      content: attr(data-elem);
      position: absolute;
      top: 5px;
      right: 5px;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .5);
      display: grid;
      place-items: center;
      font-size: 12px;
    }

    .tier-iron { background: radial-gradient(circle, #8d939c, #4f5762); }
    .tier-bronze { background: radial-gradient(circle, #d9a06b, #75452d); }
    .tier-silver { background: radial-gradient(circle, #fff, #aebdd0); color: #17202b; }
    .tier-gold { background: radial-gradient(circle, #fff1a4, #d99a22); color: #211704; }
    .tier-diamond { background: radial-gradient(circle, #c7feff, #4aa7ff); color: #061724; }
    .tier-legend { background: radial-gradient(circle, #ff8ed8, #b72052 58%, #44172f); }

    .controls {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 12px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(24, 30, 41, .92);
      box-shadow: var(--shadow);
      padding: 10px;
    }

    .panel-title {
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    .bench {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .bench-card {
      min-height: 76px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .14);
      background: #111722;
      display: grid;
      place-items: center;
      position: relative;
    }

    .bench-card.selected {
      outline: 3px solid #fff;
      outline-offset: -4px;
    }

    .upgrade-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .upgrade {
      min-height: 76px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .1);
      display: grid;
      gap: 4px;
      padding: 8px;
      align-content: center;
      text-align: center;
    }

    .small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      font-weight: 700;
    }

    .toast {
      position: fixed;
      left: 50%;
      top: 72px;
      transform: translateX(-50%);
      z-index: 20;
      min-height: 42px;
      min-width: min(430px, calc(100% - 24px));
      display: none;
      align-items: center;
      justify-content: center;
      padding: 9px 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, .8);
      border: 1px solid rgba(255, 255, 255, .16);
      text-align: center;
      font-weight: 900;
    }

    .toast.show { display: flex; }

    @media (max-width: 900px) {
      header { grid-template-columns: 1fr; }
      .hud { justify-content: flex-start; }
      .battlefield { grid-template-columns: 1fr; }
      .lane { min-height: 430px; }
      .lane-head {
        left: 7px;
        right: 7px;
        top: 7px;
        align-items: flex-start;
        flex-direction: column;
        gap: 2px;
        font-size: 11px;
      }
      #mobSlots { inset: 23% 8%; gap: 4px; }
      #bossSlots { inset: 27% 18%; }
      .unit { width: min(52px, 84%); }
      .unit::after {
        top: 4px;
        right: 4px;
        width: 20px;
        height: 20px;
        font-size: 11px;
      }
      .controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <div>
        <h1>배뽑디</h1>
        <div class="subtitle">왼쪽 잡몹 순환 / 오른쪽 상자·보스 순환 2Way 디펜스</div>
      </div>
      <div class="hud">
        <div class="pill" id="roundPill">R 1</div>
        <div class="pill" id="coinPill">🥈 5 · 🪙 0 · 💎 0 · 👑 0</div>
        <div class="pill" id="lifePill">❤️ 50</div>
        <button class="btn" id="speedBtn">⏩ 1x</button>
        <button class="btn red" id="restartBtn">↻</button>
      </div>
    </header>

    <div class="status" id="statusText">10라운드 전까지 오른쪽 보물상자 하나를 부숴 코인을 벌고, 왼쪽 잡몹 압박을 버티세요.</div>

    <section class="battlefield">
      <div class="lane" id="mobLane">
        <div class="lane-head">
          <span>🌀 왼쪽 잡몹 라인</span>
          <span id="mobCount">0마리</span>
        </div>
        <canvas id="mobCanvas"></canvas>
        <div class="slots" id="mobSlots"></div>
      </div>

      <div class="lane" id="bossLane">
        <div class="lane-head">
          <span>💎 오른쪽 상자 / 보스 라인</span>
          <span id="bossInfo">상자 HP 0</span>
        </div>
        <canvas id="bossCanvas"></canvas>
        <div class="slots" id="bossSlots"></div>
      </div>
    </section>

    <section class="controls">
      <div class="panel">
        <h2 class="panel-title">뽑기 & 대기석</h2>
        <div style="display:flex; gap:8px; margin-bottom:9px; flex-wrap:wrap;">
          <button class="btn primary" id="drawBtn">🎰 1실버 뽑기</button>
          <button class="btn blue" id="sellBtn">💰 판매선택</button>
        </div>
        <div class="bench" id="bench"></div>
      </div>

      <div class="panel">
        <h2 class="panel-title">원소 업그레이드</h2>
        <div class="upgrade-grid" id="upgrades"></div>
        <h2 class="panel-title" style="margin-top:12px;">코인 쪼개기</h2>
        <div class="upgrade-grid">
          <button class="upgrade" id="splitBoss"><strong>👑 → 💎💎</strong><span class="small">보스코인 분해</span></button>
          <button class="upgrade" id="splitDiamond"><strong>💎 → 🪙🪙</strong><span class="small">다이아코인 분해</span></button>
          <button class="upgrade" id="splitGold"><strong>🪙 → 🥈🥈🥈</strong><span class="small">골드코인 분해</span></button>
        </div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const tiers = [
      { key: "iron", label: "I", name: "아이언", dmg: 12, rate: .92 },
      { key: "bronze", label: "B", name: "브론즈", dmg: 26, rate: .8 },
      { key: "silver", label: "S", name: "실버", dmg: 58, rate: .72 },
      { key: "gold", label: "G", name: "골드", dmg: 130, rate: .62 },
      { key: "diamond", label: "D", name: "다이아", dmg: 280, rate: .56, splash: true },
      { key: "legend", label: "L", name: "전설", dmg: 760, rate: .5, splash: true }
    ];

    const elems = [
      { key: "fire", icon: "🔥", name: "불", color: "#ff5c70" },
      { key: "water", icon: "💧", name: "물", color: "#62b9ff" },
      { key: "grass", icon: "🌿", name: "풀", color: "#67df8d" }
    ];

    const state = {
      round: 1,
      coins: { silver: 5, gold: 0, diamond: 0, boss: 0 },
      lives: 50,
      speed: 1,
      time: 0,
      roundTime: 0,
      nextId: 1,
      selected: null,
      sellMode: false,
      gameOver: false,
      units: [],
      mobs: [],
      shots: [],
      effects: [],
      chest: null,
      chestClaimed: false,
      boss: null,
      bossDefeated: false,
      upgrades: { fire: 0, water: 0, grass: 0 },
      spawnTimer: 0,
      last: performance.now(),
      dirty: true
    };

    const $ = (id) => document.getElementById(id);
    const canvases = { mob: $("mobCanvas"), boss: $("bossCanvas") };
    const ctxs = { mob: canvases.mob.getContext("2d"), boss: canvases.boss.getContext("2d") };
    const mobSlotLayout = Array.from({ length: 20 }, (_, i) => {
      const col = i % 5;
      const row = Math.floor(i / 5);
      return [.22 + col * .14, .33 + row * .105];
    });
    const bossSlotLayout = [[.39, .40], [.61, .40], [.39, .60], [.61, .60]];

    function toast(text) {
      const node = $("toast");
      node.textContent = text;
      node.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => node.classList.remove("show"), 1300);
    }

    function fitCanvas(canvas) {
      const box = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const w = Math.max(1, Math.floor(box.width * dpr));
      const h = Math.max(1, Math.floor(box.height * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      return { dpr };
    }

    function pathPoint(canvas, t) {
      const { width: w, height: h } = canvas;
      const pad = Math.min(w, h) * .09;
      const left = pad, right = w - pad, top = pad, bottom = h - pad;
      const p = ((t % 1) + 1) % 1;
      if (p < .25) return { x: left + (right - left) * (p / .25), y: top };
      if (p < .5) return { x: right, y: top + (bottom - top) * ((p - .25) / .25) };
      if (p < .75) return { x: right - (right - left) * ((p - .5) / .25), y: bottom };
      return { x: left, y: bottom - (bottom - top) * ((p - .75) / .25) };
    }

    function slotPos(lane, slot) {
      const canvas = canvases[lane];
      const layout = lane === "mob" ? mobSlotLayout : bossSlotLayout;
      const [x, y] = layout[slot];
      return { x: canvas.width * x, y: canvas.height * y };
    }

    function randomElem() {
      return elems[Math.floor(Math.random() * elems.length)];
    }

    function rollTier() {
      const r = Math.random();
      if (r > .992) return tiers[5];
      if (r > .97) return tiers[4];
      if (r > .9) return tiers[3];
      if (r > .75) return tiers[2];
      if (r > .48) return tiers[1];
      return tiers[0];
    }

    function tier(key) {
      return tiers.find((item) => item.key === key);
    }

    function elem(key) {
      return elems.find((item) => item.key === key);
    }

    function emptyBench() {
      return state.units.filter((unit) => unit.lane === "bench").length < 10;
    }

    function slotUnit(lane, slot) {
      return state.units.find((unit) => unit.lane === lane && unit.slot === slot);
    }

    function selectedUnit() {
      return state.units.find((unit) => unit.id === state.selected);
    }

    function damage(unit) {
      return tier(unit.tier).dmg * (1 + state.upgrades[unit.elem] * .16);
    }

    function coinText() {
      const c = state.coins;
      return `🥈 ${c.silver} · 🪙 ${c.gold} · 💎 ${c.diamond} · 👑 ${c.boss}`;
    }

    function reset() {
      Object.assign(state, {
        round: 1,
        coins: { silver: 5, gold: 0, diamond: 0, boss: 0 },
        lives: 50,
        speed: 1,
        time: 0,
        roundTime: 0,
        nextId: 1,
        selected: null,
        sellMode: false,
        gameOver: false,
        units: [],
        mobs: [],
        shots: [],
        effects: [],
        chest: makeChest(),
        chestClaimed: false,
        boss: null,
        bossDefeated: false,
        upgrades: { fire: 0, water: 0, grass: 0 },
        spawnTimer: 0,
        last: performance.now(),
        dirty: true
      });
      toast("새 게임 시작");
      renderStatic();
    }

    function makeChest() {
      return { hp: 650, maxHp: 650, t: .12, speed: .045, reward: 8, dead: false };
    }

    function makeBoss() {
      const hp = 4300 + state.round * 520;
      return { hp, maxHp: hp, t: .08, speed: .04 + state.round * .001, elem: randomElem().key, dead: false };
    }

    function drawUnit() {
      if (state.gameOver) return;
      if (state.coins.silver < 1) return toast("실버코인이 부족합니다.");
      if (!emptyBench()) return toast("대기석이 가득 찼습니다.");
      const picked = rollTier();
      const element = randomElem();
      state.coins.silver -= 1;
      state.units.push({
        id: state.nextId++,
        lane: "bench",
        slot: null,
        tier: picked.key,
        elem: element.key,
        cd: Math.random() * .4,
        kills: 0
      });
      state.selected = state.units[state.units.length - 1].id;
      state.sellMode = false;
      state.dirty = true;
      toast(`${picked.name} ${element.icon} 뽑음`);
      renderStatic();
    }

    function sellReward(unit) {
      const t = tier(unit.tier);
      if (t.key === "legend") return { type: "diamond", amount: 2, label: "💎 2" };
      if (t.key === "diamond") return { type: "diamond", amount: 1, label: "💎 1" };
      if (t.key === "gold") return { type: "gold", amount: 1, label: "🪙 1" };
      const amount = t.key === "silver" ? 3 : t.key === "bronze" ? 2 : 1;
      return { type: "silver", amount, label: `🥈 ${amount}` };
    }

    function sellUnit(unit) {
      const reward = sellReward(unit);
      state.coins[reward.type] += reward.amount;
      state.units = state.units.filter((item) => item.id !== unit.id);
      if (state.selected === unit.id) state.selected = null;
      state.dirty = true;
      toast(`판매 완료 · ${reward.label}`);
      renderStatic();
    }

    function toggleSellMode() {
      state.sellMode = !state.sellMode;
      state.selected = null;
      state.dirty = true;
      toast(state.sellMode ? "판매할 유닛을 계속 터치하세요." : "판매선택 해제");
      renderStatic();
    }

    function splitCoin(type) {
      if (state.coins[type] < 1) return toast("쪼갤 코인이 없습니다.");
      state.coins[type] -= 1;
      if (type === "boss") state.coins.diamond += 2;
      if (type === "diamond") state.coins.gold += 2;
      if (type === "gold") state.coins.silver += 3;
      state.dirty = true;
      renderStatic();
    }

    function upgrade(key) {
      const level = state.upgrades[key];
      const cost = Math.floor(level / 3) + 1;
      if (state.coins.silver < cost) return toast("실버코인이 부족합니다.");
      state.coins.silver -= cost;
      state.upgrades[key] += 1;
      state.dirty = true;
      toast(`${elem(key).name} 공격력 강화`);
      renderStatic();
    }

    function placeUnit(lane, slot) {
      const current = slotUnit(lane, slot);
      if (current) {
        if (state.sellMode) return sellUnit(current);
        state.selected = current.id;
        state.dirty = true;
        renderStatic();
        return;
      }
      const unit = selectedUnit();
      if (!unit) return toast("유닛을 먼저 선택하세요.");
      unit.lane = lane;
      unit.slot = slot;
      state.selected = unit.id;
      state.sellMode = false;
      state.dirty = true;
      toast(lane === "mob" ? "왼쪽 라인 배치" : "오른쪽 라인 배치");
      renderStatic();
    }

    function makeMob() {
      const hp = 70 + state.round * 25;
      return {
        id: state.nextId++,
        hp,
        maxHp: hp,
        t: Math.random() * .08,
        speed: .045 + state.round * .003 + Math.random() * .01,
        elem: randomElem().key,
        size: 7 + Math.random() * 5
      };
    }

    function nextRound() {
      state.round += 1;
      state.roundTime = 0;
      state.coins.silver += 2;
      if (state.round === 10) {
        state.chest = null;
        if (!state.bossDefeated) state.boss = makeBoss();
        toast("10라운드 보스 등장");
      } else {
        toast(`${state.round}라운드 · 보상 🥈 2`);
      }
      state.dirty = true;
      renderStatic();
    }

    function update(dt) {
      if (state.gameOver) return;
      state.time += dt;
      state.roundTime += dt;

      const spawnEvery = Math.max(.24, .78 - state.round * .018);
      state.spawnTimer += dt;
      while (state.spawnTimer >= spawnEvery) {
        state.spawnTimer -= spawnEvery;
        const amount = state.round < 4 ? 1 : state.round < 8 ? 2 : 3;
        for (let i = 0; i < amount; i++) state.mobs.push(makeMob());
      }

      state.mobs.forEach((mob) => {
        mob.t += mob.speed * dt;
        if (mob.t >= 1) {
          mob.t -= 1;
          state.lives -= 1;
          mob.hp += mob.maxHp * .45;
        }
      });

      if (state.chest && !state.chest.dead) state.chest.t += state.chest.speed * dt;
      if (state.boss && !state.boss.dead) state.boss.t += state.boss.speed * dt;

      state.units.filter((unit) => unit.lane !== "bench").forEach((unit) => {
        unit.cd -= dt;
        if (unit.cd > 0) return;
        const target = findTarget(unit);
        if (!target) return;
        const from = slotPos(unit.lane, unit.slot);
        const to = targetPoint(unit.lane, target);
        unit.cd = tier(unit.tier).rate;
        if (unit.elem === "fire") {
          hitTarget(unit, target, damage(unit), !!tier(unit.tier).splash);
          state.effects.push({ lane: unit.lane, x: to.x, y: to.y, color: "#ff304d", age: 0, kind: "fire" });
        } else {
          state.shots.push({
            lane: unit.lane,
            fromX: from.x,
            fromY: from.y,
            x: from.x,
            y: from.y,
            toX: to.x,
            toY: to.y,
            target,
            unitId: unit.id,
            elem: unit.elem,
            dmg: damage(unit),
            splash: !!tier(unit.tier).splash,
            color: elem(unit.elem).color,
            life: 0
          });
        }
      });

      updateShots(dt);
      state.effects.forEach((effect) => effect.age += dt);
      state.effects = state.effects.filter((effect) => effect.age < .45);
      state.mobs = state.mobs.filter((mob) => mob.hp > 0);

      if (state.mobs.length > 115) lose("잡몹이 화면을 장악했습니다.");
      if (state.lives <= 0) lose("라인이 무너졌습니다.");
      if (state.roundTime > 24) nextRound();
      if (state.boss && state.boss.hp <= 0 && !state.boss.dead) {
        state.boss.dead = true;
        state.bossDefeated = true;
        state.coins.boss += 1;
        toast("보스 처치 · 👑 1");
        state.dirty = true;
      }
    }

    function findTarget(unit) {
      if (unit.lane === "mob") return state.mobs[0] || null;
      if (state.boss && !state.boss.dead) return state.boss;
      return state.chest && !state.chest.dead ? state.chest : null;
    }

    function targetPoint(lane, target) {
      return pathPoint(canvases[lane], target.t);
    }

    function hitTarget(unit, target, dmg, splash) {
      if (!target || target.hp <= 0) return;
      target.hp -= dmg;
      if (unit.lane === "mob" && splash) {
        state.mobs.slice(0, 5).forEach((mob) => {
          if (mob !== target) mob.hp -= dmg * .35;
        });
      }
      if (unit.lane === "mob" && target.hp <= 0) {
        unit.kills += 1;
        if (Math.random() < .18) state.coins.silver += 1;
        state.dirty = true;
      }
      if (target === state.chest && target.hp <= 0 && !target.dead) {
        target.dead = true;
        state.chestClaimed = true;
        state.coins.silver += target.reward;
        toast(`보물상자 파괴 · 🥈 ${target.reward}`);
        state.dirty = true;
      }
    }

    function updateShots(dt) {
      state.shots.forEach((shot) => {
        shot.life += dt * 5.5;
        const p = Math.min(1, shot.life);
        shot.x = shot.fromX + (shot.toX - shot.fromX) * p;
        shot.y = shot.fromY + (shot.toY - shot.fromY) * p;
        if (p < 1 || shot.hit) return;
        shot.hit = true;
        const unit = state.units.find((item) => item.id === shot.unitId);
        if (!unit) return;
        hitTarget(unit, shot.target, shot.dmg, shot.splash);
      });
      state.shots = state.shots.filter((shot) => shot.life < 1.18);
    }

    function lose(text) {
      state.gameOver = true;
      state.speed = 1;
      toast(`패배: ${text}`);
      renderStatic();
    }

    function drawLane(lane) {
      const canvas = canvases[lane];
      const ctx = ctxs[lane];
      const { dpr } = fitCanvas(canvas);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.lineWidth = 5 * dpr;
      ctx.strokeStyle = lane === "mob" ? "rgba(98,185,255,.52)" : "rgba(255,212,96,.55)";
      ctx.setLineDash([12 * dpr, 12 * dpr]);
      const pad = Math.min(canvas.width, canvas.height) * .09;
      ctx.strokeRect(pad, pad, canvas.width - pad * 2, canvas.height - pad * 2);
      ctx.setLineDash([]);
      drawGridGlow(ctx, canvas, lane);
      if (lane === "mob") drawMobs(ctx, canvas);
      else drawRightTarget(ctx, canvas);
      drawShots(ctx, lane);
      drawEffects(ctx, lane);
      ctx.restore();
    }

    function drawGridGlow(ctx, canvas, lane) {
      ctx.globalAlpha = .11;
      ctx.fillStyle = lane === "mob" ? "#62b9ff" : "#ffd460";
      const layouts = lane === "mob" ? mobSlotLayout : bossSlotLayout;
      layouts.forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(canvas.width * x, canvas.height * y, 34, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function drawMobs(ctx, canvas) {
      state.mobs.forEach((mob) => {
        const p = pathPoint(canvas, mob.t);
        const e = elem(mob.elem);
        const scale = window.devicePixelRatio || 1;
        ctx.beginPath();
        ctx.fillStyle = e.color;
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 14;
        ctx.arc(p.x, p.y, mob.size * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        const hp = Math.max(0, mob.hp / mob.maxHp);
        ctx.fillStyle = "rgba(0,0,0,.6)";
        ctx.fillRect(p.x - 14, p.y - 18, 28, 4);
        ctx.fillStyle = "#fff";
        ctx.fillRect(p.x - 14, p.y - 18, 28 * hp, 4);
      });
    }

    function drawRightTarget(ctx, canvas) {
      const target = state.boss && !state.boss.dead ? state.boss : state.chest && !state.chest.dead ? state.chest : null;
      if (!target) return;
      const p = pathPoint(canvas, target.t);
      const isBoss = !!(state.boss && !state.boss.dead);
      const color = isBoss ? "#ff5c70" : "#ffd460";
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(state.time * 2);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 22;
      if (isBoss) {
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = i / 8 * Math.PI * 2;
          const r = i % 2 ? 28 : 42;
          ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(-34, -28, 68, 56);
        ctx.fillStyle = "rgba(0,0,0,.28)";
        ctx.fillRect(-6, -28, 12, 56);
      }
      ctx.restore();
      const hp = Math.max(0, target.hp / target.maxHp);
      ctx.fillStyle = "rgba(0,0,0,.65)";
      ctx.fillRect(p.x - 48, p.y + 48, 96, 8);
      ctx.fillStyle = color;
      ctx.fillRect(p.x - 48, p.y + 48, 96 * hp, 8);
    }

    function drawShots(ctx, lane) {
      const scale = window.devicePixelRatio || 1;
      state.shots.filter((shot) => shot.lane === lane).forEach((shot) => {
        ctx.shadowColor = shot.color;
        ctx.shadowBlur = 12;
        if (shot.elem === "grass") {
          ctx.fillStyle = shot.color;
          ctx.beginPath();
          ctx.arc(shot.x, shot.y, 8 * scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "rgba(220,255,230,.8)";
          ctx.lineWidth = 2 * scale;
          ctx.stroke();
        } else {
          ctx.strokeStyle = shot.color;
          ctx.lineWidth = 4 * scale;
          ctx.beginPath();
          ctx.moveTo(shot.fromX, shot.fromY);
          ctx.lineTo(shot.x, shot.y);
          ctx.stroke();
        }
        ctx.shadowBlur = 0;
      });
    }

    function drawEffects(ctx, lane) {
      const scale = window.devicePixelRatio || 1;
      state.effects.filter((effect) => effect.lane === lane).forEach((effect) => {
        const p = effect.age / .45;
        ctx.save();
        ctx.globalAlpha = 1 - p;
        ctx.strokeStyle = effect.color;
        ctx.fillStyle = "rgba(255,48,77,.18)";
        ctx.lineWidth = 4 * scale;
        ctx.shadowColor = effect.color;
        ctx.shadowBlur = 22;
        ctx.beginPath();
        ctx.arc(effect.x, effect.y, (18 + p * 26) * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });
    }

    function renderStatic() {
      updateHud();
      renderSlots("mob", $("mobSlots"), 20);
      renderSlots("boss", $("bossSlots"), 4);
      renderBench();
      renderUpgrades();
      $("app").classList.toggle("sell-mode", state.sellMode);
      $("sellBtn").classList.toggle("active", state.sellMode);
      state.dirty = false;
    }

    function updateHud() {
      $("roundPill").textContent = `R ${state.round}`;
      $("coinPill").textContent = coinText();
      $("lifePill").textContent = `❤️ ${state.lives}`;
      $("speedBtn").textContent = `⏩ ${state.speed}x`;
      $("mobCount").textContent = `${state.mobs.length}마리`;
      if (state.boss && !state.boss.dead) $("bossInfo").textContent = `보스 HP ${Math.ceil(state.boss.hp)} / ${state.boss.maxHp}`;
      else if (state.chest && !state.chest.dead) $("bossInfo").textContent = `상자 HP ${Math.max(0, Math.ceil(state.chest.hp))} / ${state.chest.maxHp}`;
      else if (state.round < 10) $("bossInfo").textContent = "상자 파괴 완료";
      else $("bossInfo").textContent = state.bossDefeated ? "보스 처치 완료" : "보스 대기";
      $("statusText").textContent = state.gameOver
        ? "게임 종료. 재시작으로 다시 도전하세요."
        : state.sellMode
          ? "판매선택 중입니다. 유닛을 탭하면 계속 판매됩니다."
          : state.round < 10
            ? "오른쪽 보물상자는 10라운드 전 단 하나만 등장합니다. 부숴서 실버코인을 확보하세요."
            : "10라운드부터 오른쪽에는 단 하나의 보스가 등장합니다.";
    }

    function renderSlots(lane, root, count) {
      root.innerHTML = "";
      for (let i = 0; i < count; i++) {
        const button = document.createElement("button");
        const unit = slotUnit(lane, i);
        button.className = `slot${state.selected && !unit ? " ready" : ""}${unit?.id === state.selected ? " selected" : ""}`;
        button.setAttribute("aria-label", `${lane}-${i + 1}`);
        button.onclick = () => placeUnit(lane, i);
        if (unit) button.appendChild(unitNode(unit));
        root.appendChild(button);
      }
    }

    function unitNode(unit) {
      const t = tier(unit.tier);
      const e = elem(unit.elem);
      const node = document.createElement("div");
      node.className = `unit tier-${unit.tier}`;
      node.dataset.elem = e.icon;
      node.textContent = t.label;
      node.title = `${t.name} ${e.name} · 킬 ${unit.kills}`;
      return node;
    }

    function renderBench() {
      const root = $("bench");
      root.innerHTML = "";
      const units = state.units.filter((unit) => unit.lane === "bench");
      for (let i = 0; i < 10; i++) {
        const unit = units[i];
        const button = document.createElement("button");
        button.className = `bench-card${unit?.id === state.selected ? " selected" : ""}`;
        button.setAttribute("aria-label", unit ? `${tier(unit.tier).name} ${elem(unit.elem).name}` : "빈 대기석");
        button.onclick = () => {
          if (!unit) return;
          if (state.sellMode) return sellUnit(unit);
          state.selected = unit.id;
          renderStatic();
        };
        if (unit) button.appendChild(unitNode(unit));
        else button.innerHTML = `<span class="small">빈칸</span>`;
        root.appendChild(button);
      }
    }

    function renderUpgrades() {
      $("upgrades").innerHTML = elems.map((item) => {
        const level = state.upgrades[item.key];
        const cost = Math.floor(level / 3) + 1;
        return `<button class="upgrade" data-up="${item.key}">
          <strong>${item.icon} ${item.name} Lv.${level}</strong>
          <span class="small">비용 🥈 ${cost} · 피해 +16%</span>
        </button>`;
      }).join("");
      document.querySelectorAll("[data-up]").forEach((button) => {
        button.onclick = () => upgrade(button.dataset.up);
      });
    }

    function loop(now) {
      const raw = Math.min(.05, (now - state.last) / 1000);
      state.last = now;
      update(raw * state.speed);
      drawLane("mob");
      drawLane("boss");
      updateHud();
      if (state.dirty) renderStatic();
      requestAnimationFrame(loop);
    }

    $("drawBtn").onclick = drawUnit;
    $("sellBtn").onclick = toggleSellMode;
    $("restartBtn").onclick = reset;
    $("speedBtn").onclick = () => {
      state.speed = state.speed === 1 ? 2 : 1;
      renderStatic();
    };
    $("splitBoss").onclick = () => splitCoin("boss");
    $("splitDiamond").onclick = () => splitCoin("diamond");
    $("splitGold").onclick = () => splitCoin("gold");
    window.addEventListener("resize", renderStatic);

    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
