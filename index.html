<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11151d">
  <title>배뽑디 - 2Way 뽑기 디펜스</title>
  <style>
    :root {
      --bg: #10131a;
      --panel: #181e29;
      --line: #334054;
      --ink: #f7f9ff;
      --muted: #aab5c7;
      --red: #ff5c70;
      --blue: #62b9ff;
      --green: #67df8d;
      --gold: #ffd460;
      --shadow: 0 20px 70px rgba(0, 0, 0, .34);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 0%, rgba(255, 92, 112, .16), transparent 28%),
        radial-gradient(circle at 80% 3%, rgba(98, 185, 255, .14), transparent 30%),
        linear-gradient(145deg, #10131a, #141a24 54%, #10141d);
      overflow-x: hidden;
    }

    button {
      border: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .app {
      width: min(1280px, 100%);
      margin: 0 auto;
      min-height: 100vh;
      padding: max(12px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 12px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 44px);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .hud {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      position: relative;
    }

    .pill, .btn {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .12);
      background: rgba(24, 30, 41, .9);
      box-shadow: 0 9px 22px rgba(0, 0, 0, .2);
      font-weight: 900;
      white-space: nowrap;
    }

    .btn.primary {
      color: #231906;
      border-color: rgba(255, 212, 96, .45);
      background: linear-gradient(135deg, #ffe085, #ff9f52);
    }

    .btn.blue {
      color: #061622;
      background: linear-gradient(135deg, #62b9ff, #67df8d);
    }

    .btn.red {
      background: linear-gradient(135deg, #ff5c70, #bb7cff);
    }

    .btn.active {
      outline: 3px solid rgba(255, 255, 255, .85);
      outline-offset: -4px;
      background: linear-gradient(135deg, #ff5c70, #ff9f52);
      color: #fff;
    }

    .records-panel {
      position: absolute;
      z-index: 30;
      right: 0;
      top: calc(100% + 8px);
      width: min(420px, calc(100vw - 24px));
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 8px;
      background: rgba(15, 19, 27, .98);
      box-shadow: var(--shadow);
      display: grid;
      gap: 7px;
    }

    .records-panel[hidden] {
      display: none;
    }

    .record-row {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 8px;
      padding: 8px;
      border-radius: 7px;
      background: rgba(255, 255, 255, .06);
      font-size: 12px;
      line-height: 1.35;
    }

    .record-round {
      font-weight: 1000;
      color: #ffd460;
    }

    .status {
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 9px 12px;
      border: 1px solid rgba(255, 212, 96, .34);
      border-radius: 8px;
      background: linear-gradient(90deg, rgba(255, 212, 96, .12), rgba(98, 185, 255, .1), rgba(103, 223, 141, .1));
      color: #fff3c1;
      text-align: center;
      font-weight: 900;
    }

    .battlefield {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      min-height: 0;
    }

    .lane {
      position: relative;
      min-height: 520px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(32, 40, 56, .95), rgba(20, 25, 35, .95));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .lane.danger {
      border-color: rgba(255, 92, 112, .78);
      box-shadow: 0 0 0 1px rgba(255, 92, 112, .24), 0 0 34px rgba(255, 48, 77, .32), var(--shadow);
      animation: dangerPulse .72s ease-in-out infinite alternate;
    }

    .pill.danger {
      color: #fff;
      border-color: rgba(255, 92, 112, .78);
      background: linear-gradient(135deg, rgba(255, 48, 77, .92), rgba(255, 159, 82, .86));
      animation: dangerPulse .72s ease-in-out infinite alternate;
    }

    .lane-head {
      position: absolute;
      z-index: 5;
      left: 12px;
      right: 12px;
      top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      pointer-events: none;
    }

    .lane canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .slots {
      position: absolute;
      z-index: 4;
      display: grid;
    }

    #mobSlots {
      inset: 28% 10% 25%;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 5px;
    }

    #bossSlots {
      inset: 28% 10% 25%;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 5px;
    }

    .slot {
      position: relative;
      min-width: 0;
      border-radius: 8px;
      border: 2px dashed rgba(255, 255, 255, .22);
      background: rgba(10, 14, 21, .38);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .slot.ready {
      border-color: rgba(98, 185, 255, .9);
      box-shadow: inset 0 0 0 2px rgba(98, 185, 255, .18), 0 0 18px rgba(98, 185, 255, .2);
    }

    .slot.selected {
      border-style: solid;
      border-color: #fff;
      animation: pulse .75s ease-in-out infinite;
    }

    .sell-mode .slot,
    .sell-mode .bench-card {
      border-color: rgba(255, 92, 112, .9);
    }

    @keyframes pulse {
      50% { filter: brightness(1.35); }
    }

    .unit {
      position: relative;
      width: min(54px, 76%);
      max-width: 76%;
      height: auto;
      aspect-ratio: 1 / 1;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .45);
      display: grid;
      place-items: center;
      font-weight: 1000;
      font-size: clamp(28px, 4.5vw, 44px);
      line-height: 1;
      text-shadow: 0 2px 10px rgba(0, 0, 0, .45);
      pointer-events: none;
    }

    .unit-emoji {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      line-height: 1;
      transform: translateY(.02em);
    }

    .unit.special-unit .unit-emoji {
      font-size: 30px;
      font-weight: 1000;
      letter-spacing: 0;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .45);
    }

    .unit::after {
      content: attr(data-tier);
      position: absolute;
      top: 5px;
      right: 5px;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .5);
      display: grid;
      place-items: center;
      font-size: 11px;
    }

    .unit[data-special]::before {
      content: attr(data-special);
      position: absolute;
      left: 5px;
      bottom: 5px;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .52);
      display: grid;
      place-items: center;
      font-size: 12px;
    }

    .unit-elements {
      position: absolute;
      left: 50%;
      bottom: 5px;
      transform: translateX(-50%);
      display: flex;
      gap: 1px;
      padding: 1px 4px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .55);
      font-size: 10px;
      line-height: 1;
      white-space: nowrap;
    }

    .tier-iron { background: radial-gradient(circle, #8d939c, #4f5762); }
    .tier-bronze { background: radial-gradient(circle, #d9a06b, #75452d); }
    .tier-silver { background: radial-gradient(circle, #fff, #aebdd0); color: #17202b; }
    .tier-gold { background: radial-gradient(circle, #fff1a4, #d99a22); color: #211704; }
    .tier-diamond { background: radial-gradient(circle, #c7feff, #4aa7ff); color: #061724; }
    .tier-legend { background: radial-gradient(circle, #ff8ed8, #b72052 58%, #44172f); }

    .controls {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 12px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(24, 30, 41, .92);
      box-shadow: var(--shadow);
      padding: 10px;
    }

    .panel-title {
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    .bench {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .bench-card {
      min-height: 76px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .14);
      background: #111722;
      display: grid;
      place-items: center;
      position: relative;
    }

    .bench-card.selected {
      outline: 3px solid #fff;
      outline-offset: -4px;
    }

    .upgrade-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .upgrade {
      min-height: 76px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .1);
      display: grid;
      gap: 4px;
      padding: 8px;
      align-content: center;
      text-align: center;
    }

    .dps-list {
      display: grid;
      gap: 6px;
    }

    .dps-row {
      display: grid;
      grid-template-columns: 72px 1fr 44px;
      gap: 7px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .dps-track {
      height: 10px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .32);
      overflow: hidden;
    }

    .dps-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff5c70, #ffd460, #67df8d, #62b9ff);
    }

    .small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      font-weight: 700;
    }

    .toast {
      position: fixed;
      left: 50%;
      top: 72px;
      transform: translateX(-50%);
      z-index: 20;
      min-height: 42px;
      min-width: min(430px, calc(100% - 24px));
      display: none;
      align-items: center;
      justify-content: center;
      padding: 9px 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, .8);
      border: 1px solid rgba(255, 255, 255, .16);
      text-align: center;
      font-weight: 900;
    }

    .toast.show { display: flex; }

    .hype {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      place-items: center;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255,255,255,.14), rgba(0,0,0,.08) 36%, transparent 68%);
    }

    .hype.show { display: grid; animation: hypeFade 1.35s ease-out forwards; }

    .hype-card {
      min-width: min(520px, calc(100vw - 28px));
      padding: 20px;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, .72);
      background: linear-gradient(135deg, rgba(20, 28, 40, .95), rgba(64, 36, 70, .95));
      box-shadow: 0 0 60px rgba(98, 185, 255, .65), 0 0 100px rgba(255, 92, 112, .35);
      text-align: center;
      transform: scale(.92);
      animation: hypePop 1.1s cubic-bezier(.2, 1.4, .35, 1) forwards;
    }

    .hype-title {
      font-size: clamp(34px, 7vw, 76px);
      font-weight: 1000;
      line-height: .95;
    }

    .hype-sub {
      margin-top: 10px;
      color: #fff3c1;
      font-size: clamp(16px, 3vw, 26px);
      font-weight: 900;
    }

    .start-screen {
      position: fixed;
      inset: 0;
      z-index: 35;
      display: grid;
      place-items: center;
      padding: 22px;
      background: radial-gradient(circle at 50% 32%, rgba(98, 185, 255, .2), rgba(11, 15, 23, .94) 58%);
    }

    .start-screen[hidden] {
      display: none;
    }

    .start-card {
      width: min(520px, 100%);
      display: grid;
      gap: 14px;
      justify-items: center;
      text-align: center;
    }

    .start-title {
      font-size: clamp(48px, 12vw, 96px);
      line-height: .92;
      font-weight: 1000;
      color: #fff;
      text-shadow: 0 0 34px rgba(98, 185, 255, .55);
    }

    .start-sub {
      color: #c7d5eb;
      font-weight: 900;
    }

    @keyframes hypePop {
      0% { transform: scale(.72) rotate(-2deg); filter: brightness(1.8); }
      65% { transform: scale(1.08) rotate(1deg); }
      100% { transform: scale(1) rotate(0); }
    }

    @keyframes hypeFade {
      0%, 78% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes dangerPulse {
      from { filter: brightness(1); }
      to { filter: brightness(1.28); }
    }

    @media (max-width: 900px) {
      header { grid-template-columns: 1fr; }
      .hud { justify-content: flex-start; }
      .battlefield { grid-template-columns: 1fr; }
      .lane { min-height: 430px; }
      .lane-head {
        left: 7px;
        right: 7px;
        top: 7px;
        align-items: flex-start;
        flex-direction: column;
        gap: 2px;
        font-size: 11px;
      }
      #mobSlots { inset: 23% 8%; gap: 4px; }
      #bossSlots { inset: 23% 8%; gap: 4px; }
      .unit { width: min(50px, 82%); max-width: 82%; }
      .unit::after {
        top: 4px;
        right: 4px;
        width: 20px;
        height: 20px;
        font-size: 11px;
      }
      .controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <div>
        <h1>배뽑디</h1>
        <div class="subtitle">왼쪽 잡몹 순환 / 오른쪽 상자·보스 지그재그 2Way 디펜스</div>
      </div>
      <div class="hud">
        <div class="pill" id="roundPill">R 1</div>
        <div class="pill" id="attrPill">속성 무</div>
        <div class="pill" id="coinPill">🥈 5.000 · 🪙 0 · 💎 0 · 👑 0</div>
        <div class="pill" id="limitPill">🌀 0 / 100</div>
        <button class="btn" id="speedBtn">⏩ 1x</button>
        <button class="btn" id="recordsBtn">📋</button>
        <button class="btn red" id="restartBtn">↻</button>
        <div class="records-panel" id="recordsPanel" hidden></div>
      </div>
    </header>

    <div class="status" id="statusText">라운드 전체 속성과 어픽스가 정해진 뒤 한 종류의 웨이브가 몰려옵니다.</div>

    <section class="battlefield">
      <div class="lane" id="mobLane">
        <div class="lane-head">
          <span>🌀 왼쪽 잡몹 라인</span>
          <span id="mobCount">0마리</span>
        </div>
        <canvas id="mobCanvas"></canvas>
        <div class="slots" id="mobSlots"></div>
      </div>

      <div class="lane" id="bossLane">
        <div class="lane-head">
          <span>💎 오른쪽 상자 / 보스 라인</span>
          <span id="bossInfo">상자 HP 0</span>
        </div>
        <canvas id="bossCanvas"></canvas>
        <div class="slots" id="bossSlots"></div>
      </div>
    </section>

    <section class="controls">
      <div class="panel">
        <h2 class="panel-title">뽑기 & 대기석</h2>
        <div style="display:flex; gap:8px; margin-bottom:9px; flex-wrap:wrap;">
          <button class="btn primary" id="drawBtn">🎰 1실버 뽑기</button>
          <button class="btn blue" id="sellBtn">💰 판매선택</button>
          <button class="btn" id="deployLeftBtn">⬅ 대기석 모두 왼쪽배치</button>
          <button class="btn" id="recallLowBtn">↩ 낮은등급 대기석</button>
          <button class="btn" id="moveTopLeftBtn">⬅ 높은등급 5기</button>
          <button class="btn" id="moveTopRightBtn">➡ 높은등급 5기</button>
          <button class="btn red" id="sellBenchBtn">💰 대기석 모두 팔기</button>
        </div>
        <div class="bench" id="bench"></div>
      </div>

      <div class="panel">
        <h2 class="panel-title">원소 업그레이드</h2>
        <div class="upgrade-grid" id="upgrades"></div>
        <h2 class="panel-title" style="margin-top:12px;">픽 & 특수유닛</h2>
        <div class="upgrade-grid">
          <button class="upgrade" id="bossPick"><strong>👑 → D픽</strong><span class="small">다이아 유닛 확정</span></button>
          <button class="upgrade" id="diamondPick"><strong>💎 → G픽</strong><span class="small">골드 유닛 확정</span></button>
          <button class="upgrade" id="goldPick"><strong>🪙 → S픽</strong><span class="small">실버 유닛 확정</span></button>
          <button class="upgrade" id="splitBoss"><strong>👑 → 💎💎</strong><span class="small">보스코인 분해</span></button>
          <button class="upgrade" id="splitDiamond"><strong>💎 → 🪙🪙</strong><span class="small">다이아코인 분해</span></button>
          <button class="upgrade" id="splitGold"><strong>🪙 → 🥈🥈🥈</strong><span class="small">골드코인 분해</span></button>
          <button class="upgrade" id="buySlow"><strong>💎 ❄️ 감속</strong><span class="small">불+물 업글 적용 · 딜 50%</span></button>
          <button class="upgrade" id="buyStun"><strong>💎 ⚡ 기절</strong><span class="small">물+풀 업글 적용 · 딜 50%</span></button>
          <button class="upgrade" id="buySplash"><strong>💎 ⏩ 공속</strong><span class="small">풀+불 업글 적용 · 딜 50%</span></button>
        </div>
        <div class="upgrade-grid" id="pickElements" style="display:none; margin-top:8px;">
          <button class="upgrade" data-pick-element="fire"><strong>🔥 불</strong><span class="small">픽 원소 선택</span></button>
          <button class="upgrade" data-pick-element="water"><strong>💧 물</strong><span class="small">픽 원소 선택</span></button>
          <button class="upgrade" data-pick-element="grass"><strong>🌿 풀</strong><span class="small">픽 원소 선택</span></button>
        </div>
        <h2 class="panel-title" style="margin-top:12px;">실시간 DPS</h2>
        <div class="dps-list" id="dpsList"></div>
      </div>
    </section>
  </div>

  <div class="start-screen" id="startScreen">
    <div class="start-card">
      <div class="start-title">배뽑디</div>
      <div class="start-sub">배치하고 뽑아서 30라 보스를 잡아내세요.</div>
      <button class="btn primary" id="startBtn">게임 시작</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="hype" id="hype"><div class="hype-card"><div class="hype-title" id="hypeTitle"></div><div class="hype-sub" id="hypeSub"></div></div></div>

  <script>
    const ROUND_SECONDS = 45;
    const MOB_SPAWN_EVERY = .18;
    const FINAL_BOSS_SECONDS = 90;
    const FINAL_SUMMON_EVERY = 20;
    const SAVE_KEY = "baebbopdi-save-v1";
    const bossRounds = [10, 20, 30];
    const elementCycle = ["fire", "grass", "water"];
    const tiers = [
      { key: "iron", label: "I", name: "아이언", dmg: 2, aps: 1.5, splash: false },
      { key: "bronze", label: "B", name: "브론즈", dmg: 5, aps: 2, splash: false },
      { key: "silver", label: "S", name: "실버", dmg: 15, aps: 2.5, splash: false },
      { key: "gold", label: "G", name: "골드", dmg: 40, aps: 3, splash: false },
      { key: "diamond", label: "D", name: "다이아", dmg: 100, aps: 4, splash: true },
      { key: "legend", label: "L", name: "전설", dmg: 300, aps: 6, splash: true }
    ];

    const elems = [
      { key: "fire", icon: "🔥", name: "불", color: "#ff5c70", beats: "grass" },
      { key: "water", icon: "💧", name: "물", color: "#62b9ff", beats: "fire" },
      { key: "grass", icon: "🌿", name: "풀", color: "#67df8d", beats: "water" }
    ];

    const affixes = [
      { key: "hp", label: "❤️ 체력 증가", hp: 1.9, speed: 1, count: 1 },
      { key: "fast", label: "⚡ 신속", hp: 1, speed: 1.7, count: 1 },
      { key: "immune", label: "🛡️ 상태이상 면역", hp: 1.15, speed: 1.05, count: 1, immune: true },
      { key: "swarm", label: "👥 대량 발생", hp: .55, speed: 1.05, count: 2.7 },
      { key: "elite", label: "👹 소수 정예", hp: 9.2, speed: .75, count: .25 }
    ];

    const state = {
      round: 1,
      coins: { silver: 5, gold: 0, diamond: 0, boss: 0 },
      speed: 1,
      maxSpeed: 2,
      time: 0,
      roundTime: 0,
      timeBank: 0,
      roundLimit: ROUND_SECONDS,
      nextId: 1,
      selected: null,
      pendingPick: null,
      sellMode: false,
      started: false,
      gameOver: false,
      units: [],
      mobs: [],
      shots: [],
      effects: [],
      damageEvents: [],
      chest: null,
      boss: null,
      bossPreview: [],
      roundElements: [],
      roundElement: null,
      affix: null,
      wave: null,
      upgrades: { fire: 0, water: 0, grass: 0 },
      stats: { totalDraws: 0, diamondDraws: 0, legendDraws: 0 },
      spawnTimer: 0,
      last: performance.now(),
      dirty: true
    };

    const $ = (id) => document.getElementById(id);
    const canvases = { mob: $("mobCanvas"), boss: $("bossCanvas") };
    const ctxs = { mob: canvases.mob.getContext("2d"), boss: canvases.boss.getContext("2d") };
    function gridCenters(cols, rows, left, top, width, height) {
      return Array.from({ length: cols * rows }, (_, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        return [left + width * ((col + .5) / cols), top + height * ((row + .5) / rows)];
      });
    }

    const mobSlotLayout = gridCenters(5, 4, .10, .28, .80, .47);
    const bossSlotLayout = gridCenters(5, 4, .10, .28, .80, .47);

    function toast(text) {
      const node = $("toast");
      node.textContent = text;
      node.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => node.classList.remove("show"), 1300);
    }

    function bigAlert(title, sub, duration = 1500) {
      $("hypeTitle").textContent = title;
      $("hypeSub").textContent = sub;
      const node = $("hype");
      node.classList.remove("show");
      void node.offsetWidth;
      node.classList.add("show");
      clearTimeout(hype.timer);
      hype.timer = setTimeout(() => node.classList.remove("show"), duration);
    }

    function hype(tierKey, elementKey) {
      const t = tier(tierKey);
      if (!t || !t.splash) return;
      const e = elem(elementKey);
      bigAlert(t.key === "legend" ? "전설 떴다!" : "다이아 떴다!", `${e.icon} ${t.name} 유닛 확보. 라인 지우러 가자.`);
    }

    function shuffle(array) {
      return array.map((value) => ({ value, sort: Math.random() })).sort((a, b) => a.sort - b.sort).map((item) => item.value);
    }

    function buildRoundElements() {
      return shuffle([...Array(12).fill(null), ...Array(6).fill("fire"), ...Array(6).fill("water"), ...Array(6).fill("grass")]);
    }

    function buildBossPreview() {
      return shuffle(["fire", "water", "grass"]).map((element, index) => ({ round: bossRounds[index], element }));
    }

    function fitCanvas(canvas) {
      const box = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const w = Math.max(1, Math.floor(box.width * dpr));
      const h = Math.max(1, Math.floor(box.height * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      return { dpr };
    }

    function boxPath(canvas, t) {
      const { width: w, height: h } = canvas;
      const pad = Math.min(w, h) * .09;
      const left = pad, right = w - pad, top = pad, bottom = h - pad;
      const p = ((t % 1) + 1) % 1;
      if (p < .25) return { x: left + (right - left) * (p / .25), y: top };
      if (p < .5) return { x: right, y: top + (bottom - top) * ((p - .25) / .25) };
      if (p < .75) return { x: right - (right - left) * ((p - .5) / .25), y: bottom };
      return { x: left, y: bottom - (bottom - top) * ((p - .75) / .25) };
    }

    function zigPath(canvas, t) {
      const p = Math.max(0, Math.min(.999, t));
      const pad = Math.min(canvas.width, canvas.height) * .09;
      const left = pad, right = canvas.width - pad, top = pad, bottom = canvas.height - pad;
      const rows = 9;
      const segment = p * rows;
      const row = Math.floor(segment);
      const f = segment - row;
      const y = top + (bottom - top) * (row / rows + f / rows);
      const leftToRight = row % 2 === 0;
      const x = leftToRight ? left + (right - left) * f : right - (right - left) * f;
      return { x, y };
    }

    function slotPos(lane, slot) {
      const canvas = canvases[lane];
      const layout = lane === "mob" ? mobSlotLayout : bossSlotLayout;
      const [x, y] = layout[slot];
      return { x: canvas.width * x, y: canvas.height * y };
    }

    function tier(key) {
      return tiers.find((item) => item.key === key);
    }

    function tierRank(key) {
      return tiers.findIndex((item) => item.key === key);
    }

    function elem(key) {
      return elems.find((item) => item.key === key);
    }

    function randomElem() {
      return elems[Math.floor(Math.random() * elems.length)];
    }

    function loadSave() {
      try {
        return JSON.parse(localStorage.getItem(SAVE_KEY) || "{}");
      } catch {
        return {};
      }
    }

    function saveProgress(data) {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({ ...loadSave(), ...data }));
      } catch {
        /* localStorage may be blocked in private browsing. */
      }
    }

    function loadMaxSpeed() {
      const saved = Number(loadSave().maxSpeed || 2);
      return Math.max(2, Math.min(5, saved));
    }

    function unlockMaxSpeed(value) {
      const next = Math.max(state.maxSpeed, Math.min(5, value));
      if (next === state.maxSpeed) return false;
      state.maxSpeed = next;
      saveProgress({ maxSpeed: next });
      return true;
    }

    function recentRecords() {
      const records = loadSave().records;
      return Array.isArray(records) ? records.slice(0, 5) : [];
    }

    function recordRun(result) {
      const record = {
        at: Date.now(),
        result,
        round: state.round,
        totalDraws: state.stats.totalDraws,
        diamondDraws: state.stats.diamondDraws,
        legendDraws: state.stats.legendDraws,
        upgrades: { ...state.upgrades }
      };
      saveProgress({ records: [record, ...recentRecords()].slice(0, 5) });
    }

    function shouldRecordRestart() {
      return !state.gameOver && (state.round > 1 || state.stats.totalDraws > 0 || Object.values(state.upgrades).some(Boolean));
    }

    function rollTier() {
      const r = Math.random();
      if (r < .45) return tiers[0];
      if (r < .80) return tiers[1];
      if (r < .93) return tiers[2];
      if (r < .975) return tiers[3];
      if (r < .99) return tiers[4];
      return tiers[5];
    }

    function rollUnitSpec() {
      const r = Math.random();
      if (r >= .995) {
        const roles = [
          { role: "slow", primary: "fire", elements: ["fire", "water"] },
          { role: "stun", primary: "water", elements: ["water", "grass"] },
          { role: "buff", primary: "grass", elements: ["grass", "fire"] }
        ];
        const spec = roles[Math.floor(Math.random() * roles.length)];
        return { tierKey: "diamond", role: spec.role, elemKey: spec.primary, elements: spec.elements, special: true };
      }
      const picked = rollTierFor(r);
      return { tierKey: picked.key, role: "dps", elemKey: randomElem().key, special: false };
    }

    function rollTierFor(r) {
      if (r < .45) return tiers[0];
      if (r < .80) return tiers[1];
      if (r < .93) return tiers[2];
      if (r < .975) return tiers[3];
      if (r < .99) return tiers[4];
      return tiers[5];
    }

    function specialRoleLabel(role) {
      return { slow: "슬로우", stun: "스턴", buff: "버프" }[role] || role;
    }

    function specialEffectLabel(role) {
      return { slow: "감속", stun: "기절", buff: "공속" }[role] || "";
    }

    function specialEffectIcon(role) {
      return { slow: "❄️", stun: "⚡", buff: "⏩" }[role] || "◆";
    }

    function specialEffectColor(role) {
      return { slow: "#78d8ff", stun: "#ffe36d", buff: "#a2ff7a" }[role] || "#ffffff";
    }

    function unitEffectColor(unit) {
      return unit.role === "dps" ? elem(unit.elem).color : specialEffectColor(unit.role);
    }

    function unitDisplayLabel(unit) {
      if (unit.role !== "dps") return specialEffectIcon(unit.role);
      return unitElements(unit).map((key) => elem(key).icon).join("");
    }

    function roleLabel(role) {
      return { dps: "딜러", slow: "슬로우", stun: "스턴", buff: "버프" }[role] || role;
    }

    function targetElementForUnit(unit) {
      if (unit.lane === "boss") return state.boss?.element || null;
      return state.roundElement || null;
    }

    function selectedUnitText() {
      const unit = selectedUnit();
      if (!unit) return "";
      const t = tier(unit.tier);
      const elementText = unitDisplayLabel(unit);
      const targetElement = targetElementForUnit(unit);
      const dps = Math.round(neutralDps(unit));
      const upgradeCount = unitElements(unit).reduce((sum, key) => sum + (state.upgrades[key] || 0), 0);
      const upgradeBonus = Math.round((upgradeMultiplier(unit) - 1) * 100);
      const relationText = targetElement ? `${elem(targetElement).icon} ${elem(targetElement).name}` : "없음";
      const relationValue = bestRelation(unit, targetElement).toFixed(2).replace(/\.?0+$/, "");
      const place = unit.lane === "bench" ? "대기석" : unit.lane === "mob" ? "왼쪽" : "오른쪽";
      return `선택: ${t.name} ${elementText} ${roleLabel(unit.role)} · 위치 ${place} · DPS ${dps} · 업그레이드: ${upgradeCount}회 (+${upgradeBonus}%) · 상성: ${relationText}(x${relationValue}) · 킬 ${unit.kills}`;
    }

    function emptyBench() {
      return state.units.filter((unit) => unit.lane === "bench").length < 10;
    }

    function slotUnit(lane, slot) {
      return state.units.find((unit) => unit.lane === lane && unit.slot === slot);
    }

    function selectedUnit() {
      return state.units.find((unit) => unit.id === state.selected);
    }

    function relation(attacker, defender) {
      if (!defender) return 1;
      const a = elem(attacker);
      const d = elem(defender);
      if (a.beats === defender) return 1.5;
      if (d.beats === attacker) return .75;
      return 1;
    }

    function unitElements(unit) {
      return unit.elements || [unit.elem];
    }

    function upgradeMultiplier(unit) {
      return unitElements(unit).reduce((mult, key) => mult * Math.pow(1.15, state.upgrades[key] || 0), 1);
    }

    function bestRelation(unit, targetElement) {
      return Math.max(...unitElements(unit).map((key) => relation(key, targetElement)));
    }

    function unitBaseDamage(unit) {
      const base = tier(unit.tier).dmg;
      return unit.role === "dps" ? base : base * .5;
    }

    function attackSpeedMultiplier(unit) {
      const hasBuff = state.units.some((ally) => ally.lane === unit.lane && ally.role === "buff");
      return hasBuff && unit.role !== "buff" ? 1.1 : 1;
    }

    function attackInterval(unit) {
      return 1 / (tier(unit.tier).aps * attackSpeedMultiplier(unit));
    }

    function baseDamage(unit, targetElement) {
      return unitBaseDamage(unit) * upgradeMultiplier(unit) * bestRelation(unit, targetElement);
    }

    function neutralDamage(unit) {
      return unitBaseDamage(unit) * upgradeMultiplier(unit);
    }

    function neutralDps(unit) {
      return neutralDamage(unit) / attackInterval(unit);
    }

    function effectiveDps(unit) {
      const targetElement = unit.lane === "mob" ? state.roundElement : state.boss?.element || null;
      return baseDamage(unit, targetElement) / attackInterval(unit);
    }

    function coinText() {
      const c = state.coins;
      return `🥈 ${c.silver.toFixed(3)} · 🪙 ${c.gold} · 💎 ${c.diamond} · 👑 ${c.boss}`;
    }

    function coinLabel(type) {
      return { silver: "🥈", gold: "🪙", diamond: "💎", boss: "👑" }[type] || type;
    }

    function formatTime(value) {
      return Math.max(0, Math.ceil(value));
    }

    function formatHp(value) {
      const n = Math.max(0, Math.ceil(value));
      if (n >= 100000000) {
        const v = n / 100000000;
        return `${Number.isInteger(v) ? v : v.toFixed(1)}억`;
      }
      if (n >= 10000) {
        const v = n / 10000;
        return `${Number.isInteger(v) ? v : v.toFixed(1)}만`;
      }
      if (n >= 1000) {
        const v = n / 1000;
        return `${Number.isInteger(v) ? v : v.toFixed(1)}천`;
      }
      return `${n}`;
    }

    function reset(started = true) {
      Object.assign(state, {
        round: 1,
        coins: { silver: 5, gold: 0, diamond: 0, boss: 0 },
        speed: 1,
        maxSpeed: loadMaxSpeed(),
        time: 0,
        roundTime: 0,
        timeBank: 0,
        roundLimit: ROUND_SECONDS,
        nextId: 1,
        selected: null,
        pendingPick: null,
        sellMode: false,
        started,
        gameOver: false,
        units: [],
        mobs: [],
        shots: [],
        effects: [],
        damageEvents: [],
        chest: makeChest(),
        boss: null,
        bossPreview: buildBossPreview(),
        roundElements: buildRoundElements(),
        roundElement: null,
        affix: null,
        wave: null,
        upgrades: { fire: 0, water: 0, grass: 0 },
        stats: { totalDraws: 0, diamondDraws: 0, legendDraws: 0 },
        spawnTimer: 0,
        last: performance.now(),
        dirty: true
      });
      startRound(1, true);
      if (started) toast("새 게임 시작");
      renderStatic();
    }

    function currentBossElement(round) {
      return state.bossPreview.find((item) => item.round === round)?.element || randomElem().key;
    }

    function makeChest(level = 1) {
      const hp = Math.round(9000 * Math.pow(1.6, level - 1));
      const reward = Math.max(1, 7 - level);
      return { level, hp, maxHp: hp, t: 0, speed: 1 / (ROUND_SECONDS * 9), reward, dead: false };
    }

    function roundMobHp(round) {
      const fixed = { 1: 4, 2: 10, 3: 20, 4: 40, 5: 100, 6: 180, 7: 300, 8: 500, 9: 800 };
      if (fixed[round]) return fixed[round];
      if (round >= 11 && round <= 19) return 1100 + (round - 11) * 300;
      if (round >= 21 && round <= 29) return 5500 + (round - 21) * 1063;
      return 0;
    }

    function makeBoss(round) {
      const hp = round === 10 ? 20000 : round === 20 ? 200000 : 1000000;
      const speed = round === 30 ? 1 / FINAL_BOSS_SECONDS : 1 / (ROUND_SECONDS * 6);
      return {
        round,
        hp,
        maxHp: hp,
        t: 0,
        speed,
        element: currentBossElement(round),
        dead: false,
        finalTimer: round === 30 ? FINAL_BOSS_SECONDS : null,
        summonTimer: 0,
        stun: 0
      };
    }

    function startRound(round, initial = false) {
      state.round = round;
      state.roundTime = 0;
      state.roundLimit = ROUND_SECONDS + state.timeBank;
      if (round === 30) state.roundLimit = FINAL_BOSS_SECONDS;
      state.spawnTimer = 0;
      state.roundElement = state.roundElements[round - 1] || null;
      state.affix = !bossRounds.includes(round) && Math.random() < .13 ? affixes[Math.floor(Math.random() * affixes.length)] : null;
      const affix = state.affix || { hp: 1, speed: 1, count: 1 };
      state.wave = {
        remaining: bossRounds.includes(round) ? 0 : state.affix?.key === "elite" ? 25 : 100,
        hp: Math.round(roundMobHp(round) * affix.hp),
        speed: (.052 + round * .003) * affix.speed,
        element: state.roundElement,
        immune: !!state.affix?.immune
      };
      if (round === 10 || round === 20 || round === 30) {
        if (state.boss && !state.boss.dead) {
          lose(`${state.boss.round}라운드 보스를 제때 처치하지 못했습니다.`);
          return;
        }
        state.chest = null;
        state.boss = makeBoss(round);
        const bossElement = elem(state.boss.element);
        bigAlert(`${round}R 보스 등장`, `${bossElement.icon} ${bossElement.name} 속성 보스가 오른쪽 라인에 진입했습니다.`, 1700);
        toast(`${round}R 보스 등장`);
      }
      if (round === 5) {
        const text = state.bossPreview.map((boss) => `${boss.round}R ${elem(boss.element).icon}${elem(boss.element).name}`).join(" / ");
        toast(`보스 예고: ${text}`);
      }
      state.dirty = true;
    }

    function drawUnit() {
      if (state.gameOver) return;
      if (state.coins.silver < 1) return toast("실버코인이 부족합니다.");
      if (!emptyBench()) return toast("대기석이 가득 찼습니다.");
      const picked = rollUnitSpec();
      const pickedTier = tier(picked.tierKey);
      const element = elem(picked.elemKey);
      state.coins.silver -= 1;
      state.units.push({
        id: state.nextId++,
        lane: "bench",
        slot: null,
        tier: picked.tierKey,
        elem: element.key,
        role: picked.role,
        elements: picked.elements,
        cd: Math.random() * .4,
        specialTimer: Math.random() * 2,
        kills: 0
      });
      state.selected = state.units[state.units.length - 1].id;
      state.stats.totalDraws += 1;
      if (!picked.special && picked.tierKey === "diamond") state.stats.diamondDraws += 1;
      if (picked.tierKey === "legend") state.stats.legendDraws += 1;
      state.sellMode = false;
      state.dirty = true;
      toast(picked.special ? `특수유닛 ${specialRoleLabel(picked.role)} 뽑음` : `${pickedTier.name} ${element.icon} 뽑음`);
      hype(picked.tierKey, element.key);
      renderStatic();
    }

    function sellReward(unit) {
      const key = tier(unit.tier).key;
      if (key === "legend") return { type: "boss", amount: 1, label: "👑 1" };
      if (key === "diamond") return { type: "diamond", amount: 1, label: "💎 1" };
      if (key === "gold") return { type: "gold", amount: 1, label: "🪙 1" };
      if (key === "silver") return { type: "silver", amount: 1, label: "🥈 1" };
      if (key === "bronze") return { type: "silver", amount: .5, label: "🥈 0.5" };
      return { type: "silver", amount: .25, label: "🥈 0.25" };
    }

    function sellUnit(unit) {
      const reward = sellReward(unit);
      state.coins[reward.type] += reward.amount;
      state.units = state.units.filter((item) => item.id !== unit.id);
      if (state.selected === unit.id) state.selected = null;
      state.dirty = true;
      toast(`판매 완료 · ${reward.label}`);
      renderStatic();
    }

    function deployBenchToLeft() {
      const benchUnits = state.units
        .filter((unit) => unit.lane === "bench")
        .sort((a, b) => tierRank(b.tier) - tierRank(a.tier));
      if (!benchUnits.length) return toast("대기석에 유닛이 없습니다.");
      let moved = 0;
      benchUnits.forEach((unit) => {
        for (let i = 0; i < 20; i++) {
          if (!slotUnit("mob", i)) {
            unit.lane = "mob";
            unit.slot = i;
            moved += 1;
            break;
          }
        }
      });
      state.selected = null;
      state.sellMode = false;
      state.dirty = true;
      toast(moved ? `${moved}기 왼쪽 배치` : "왼쪽 배치칸이 가득 찼습니다.");
      renderStatic();
    }

    function recallLowToBench() {
      const open = 10 - state.units.filter((unit) => unit.lane === "bench").length;
      if (open <= 0) return toast("대기석이 가득 찼습니다.");
      const fieldUnits = state.units
        .filter((unit) => unit.lane === "mob")
        .sort((a, b) => tierRank(a.tier) - tierRank(b.tier) || a.slot - b.slot);
      if (!fieldUnits.length) return toast("왼쪽 라인에 회수할 유닛이 없습니다.");
      let moved = 0;
      fieldUnits.slice(0, open).forEach((unit) => {
        unit.lane = "bench";
        unit.slot = null;
        moved += 1;
      });
      state.selected = null;
      state.sellMode = false;
      state.dirty = true;
      toast(`${moved}기 낮은등급 대기석 복귀`);
      renderStatic();
    }

    function moveTopUnitsToLane(targetLane) {
      const sourceLane = targetLane === "boss" ? "mob" : "boss";
      const targetName = targetLane === "boss" ? "오른쪽" : "왼쪽";
      const sourceUnits = state.units
        .filter((unit) => unit.lane === sourceLane)
        .sort((a, b) => tierRank(b.tier) - tierRank(a.tier) || a.slot - b.slot)
        .slice(0, 5);
      if (!sourceUnits.length) return toast(`${sourceLane === "mob" ? "왼쪽" : "오른쪽"} 라인에 이동할 유닛이 없습니다.`);
      let moved = 0;
      sourceUnits.forEach((unit) => {
        for (let i = 0; i < 20; i++) {
          if (!slotUnit(targetLane, i)) {
            unit.lane = targetLane;
            unit.slot = i;
            moved += 1;
            break;
          }
        }
      });
      state.selected = null;
      state.sellMode = false;
      state.dirty = true;
      toast(moved ? `${targetName}으로 높은등급 ${moved}기 이동` : `${targetName} 라인이 가득 찼습니다.`);
      renderStatic();
    }

    function sellAllBench() {
      const benchUnits = state.units.filter((unit) => unit.lane === "bench");
      if (!benchUnits.length) return toast("대기석에 판매할 유닛이 없습니다.");
      const summary = {};
      benchUnits.forEach((unit) => {
        const reward = sellReward(unit);
        state.coins[reward.type] += reward.amount;
        summary[reward.type] = (summary[reward.type] || 0) + reward.amount;
      });
      state.units = state.units.filter((unit) => unit.lane !== "bench");
      state.selected = null;
      state.sellMode = false;
      state.dirty = true;
      const label = Object.entries(summary).map(([key, value]) => `${coinLabel(key)} ${value}`).join(", ");
      toast(`대기석 ${benchUnits.length}기 판매 · ${label}`);
      renderStatic();
    }

    function toggleSellMode() {
      state.sellMode = !state.sellMode;
      state.selected = null;
      state.dirty = true;
      toast(state.sellMode ? "판매할 유닛을 계속 터치하세요." : "판매선택 해제");
      renderStatic();
    }

    function createBenchUnit(tierKey, role = "dps", elementKey = null, elementsOverride = null) {
      if (!emptyBench()) return false;
      const element = elementKey ? elem(elementKey) : randomElem();
      const unit = {
        id: state.nextId++,
        lane: "bench",
        slot: null,
        tier: tierKey,
        elem: element.key,
        role,
        cd: Math.random() * .4,
        specialTimer: Math.random() * 2,
        kills: 0
      };
      if (elementsOverride) unit.elements = elementsOverride;
      state.units.push(unit);
      state.selected = state.units[state.units.length - 1].id;
      state.sellMode = false;
      state.dirty = true;
      hype(tierKey, element.key);
      return true;
    }

    function buyPick(costType, tierKey, label) {
      if (state.coins[costType] < 1) return toast(`${coinLabel(costType)} 코인이 부족합니다.`);
      if (!emptyBench()) return toast("대기석이 가득 찼습니다.");
      state.pendingPick = { costType, tierKey, label };
      state.sellMode = false;
      state.dirty = true;
      toast(`${label}: 원소를 선택하세요.`);
      renderStatic();
    }

    function finishPick(elementKey) {
      const pick = state.pendingPick;
      if (!pick) return toast("먼저 픽을 선택하세요.");
      if (state.coins[pick.costType] < 1) {
        state.pendingPick = null;
        state.dirty = true;
        renderStatic();
        return toast(`${coinLabel(pick.costType)} 코인이 부족합니다.`);
      }
      if (!emptyBench()) return toast("대기석이 가득 찼습니다.");
      state.coins[pick.costType] -= 1;
      createBenchUnit(pick.tierKey, "dps", elementKey);
      toast(`${pick.label} ${elem(elementKey).icon} 획득`);
      state.pendingPick = null;
      renderStatic();
    }

    function buySpecial(role) {
      if (state.coins.diamond < 1) return toast("다이아코인이 부족합니다.");
      if (!emptyBench()) return toast("대기석이 가득 찼습니다.");
      const spec = {
        slow: { icon: "슬로우", primary: "fire", elements: ["fire", "water"] },
        stun: { icon: "스턴", primary: "water", elements: ["water", "grass"] },
        buff: { icon: "버프", primary: "grass", elements: ["grass", "fire"] }
      }[role];
      state.coins.diamond -= 1;
      createBenchUnit("diamond", role, spec.primary, spec.elements);
      toast(`${spec.icon} 특수유닛 획득`);
      renderStatic();
    }

    function splitCoin(from) {
      const map = {
        boss: { to: "diamond", amount: 2 },
        diamond: { to: "gold", amount: 2 },
        gold: { to: "silver", amount: 3 }
      };
      const item = map[from];
      if (!item || state.coins[from] < 1) return toast(`${coinLabel(from)} 코인이 부족합니다.`);
      state.coins[from] -= 1;
      state.coins[item.to] += item.amount;
      state.dirty = true;
      toast(`${coinLabel(from)} 1개 분해 · ${coinLabel(item.to)} ${item.amount}`);
      renderStatic();
    }

    function upgrade(key) {
      const level = state.upgrades[key];
      const cost = Math.floor(level / 3) + 1;
      if (state.coins.silver < cost) return toast("실버코인이 부족합니다.");
      state.coins.silver -= cost;
      state.upgrades[key] += 1;
      state.dirty = true;
      toast(`${elem(key).name} 공격력 강화`);
      renderStatic();
    }

    function placeUnit(lane, slot) {
      const current = slotUnit(lane, slot);
      if (current) {
        if (state.sellMode) return sellUnit(current);
        state.selected = current.id;
        state.dirty = true;
        renderStatic();
        return;
      }
      const unit = selectedUnit();
      if (!unit) return toast("유닛을 먼저 선택하세요.");
      unit.lane = lane;
      unit.slot = slot;
      state.selected = unit.id;
      state.sellMode = false;
      state.dirty = true;
      toast(lane === "mob" ? "왼쪽 라인 배치" : "오른쪽 라인 배치");
      renderStatic();
    }

    function makeMob(force = {}) {
      const hp = force.hp || state.wave.hp;
      return {
        id: state.nextId++,
        hp,
        maxHp: hp,
        t: Math.random() * .04,
        speed: force.speed || state.wave.speed,
        elem: force.element === undefined ? state.wave.element : force.element,
        immune: force.immune === undefined ? state.wave.immune : force.immune,
        summoned: !!force.summoned,
        elite: !!force.elite || state.affix?.key === "elite",
        stun: 0,
        size: 7 + Math.random() * 5
      };
    }

    function nextRound() {
      if (state.round >= 30) return;
      if (!bossRounds.includes(state.round)) {
        const reward = state.affix ? 4 : 3;
        state.coins.silver += reward;
        toast(`웨이브 보상 · 🥈 +${reward}`);
      }
      startRound(state.round + 1);
      renderStatic();
    }

    function bossCcFactor() {
      if (!state.boss) return 1;
      if (state.boss.round === 30) return 1;
      return laneSlowFactor("boss");
    }

    function laneSlowFactor(lane) {
      const hasSlow = state.units.some((unit) => unit.lane === lane && unit.role === "slow");
      return hasSlow ? .8 : 1;
    }

    function settleRoundTime(cleared) {
      if (cleared && state.roundTime < ROUND_SECONDS) {
        state.timeBank += ROUND_SECONDS - state.roundTime;
      } else if (state.roundTime > ROUND_SECONDS) {
        state.timeBank = Math.max(0, state.timeBank - (state.roundTime - ROUND_SECONDS));
      }
    }

    function forceNextRoundByTime() {
      if (state.boss && !state.boss.dead) return;
      if (state.round >= 30) return;
      settleRoundTime(false);
      state.wave.remaining = 0;
      toast("시간 종료 · 다음 라운드 시작");
      nextRound();
    }

    function update(dt) {
      if (state.gameOver) return;
      state.time += dt;
      state.roundTime += dt;

      if (state.wave?.remaining > 0) {
        state.spawnTimer += dt;
        const spawnEvery = MOB_SPAWN_EVERY;
        while (state.spawnTimer >= spawnEvery && state.wave.remaining > 0) {
          state.spawnTimer -= spawnEvery;
          state.mobs.push(makeMob());
          state.wave.remaining -= 1;
        }
      }

      state.mobs.forEach((mob) => {
        if (mob.stun > 0) mob.stun -= dt;
        const cc = mob.stun > 0 ? 0 : mob.immune ? 1 : laneSlowFactor("mob");
        mob.t += mob.speed * cc * dt;
        if (mob.t >= 1) {
          mob.t -= 1;
          mob.hp += mob.maxHp * .45;
        }
      });

      if (state.chest && !state.chest.dead) {
        state.chest.t += state.chest.speed * dt;
        if (state.chest.t >= 1) {
          state.chest.dead = true;
          toast("보물상자가 라인을 빠져나갔습니다.");
          state.dirty = true;
        }
      }

      if (state.boss && !state.boss.dead) {
        if (state.boss.stun > 0) state.boss.stun -= dt;
        state.boss.t += state.boss.speed * (state.boss.stun > 0 ? 0 : bossCcFactor()) * dt;
        if (state.boss.round === 30) {
          state.boss.finalTimer -= dt;
          state.boss.summonTimer += dt;
          if (state.boss.summonTimer >= FINAL_SUMMON_EVERY) {
            state.boss.summonTimer = 0;
            for (let i = 0; i < 15; i++) state.mobs.push(makeMob({ hp: 8000, speed: .07, element: state.roundElement, summoned: true }));
            toast("최종 보스가 잡몹을 소환했습니다.");
          }
        }
        if (state.boss.t >= 1) lose("보스가 데드라인에 도달했습니다.");
      }

      state.units.filter((unit) => unit.lane !== "bench").forEach((unit) => {
        unit.cd -= dt;
        if (unit.cd > 0) return;
        const target = findTarget(unit);
        if (!target) return;
        const from = slotPos(unit.lane, unit.slot);
        const to = targetPoint(unit.lane, target);
        unit.cd = attackInterval(unit);
        if (unit.role === "stun") {
          unit.specialTimer -= unit.cd;
          if (unit.specialTimer <= 0) {
            target.stun = Math.max(target.stun || 0, .5);
            unit.specialTimer = 2;
          }
        }
        const dmg = baseDamage(unit, target.elem || target.element || null);
        const isSplash = !!tier(unit.tier).splash;
        if (unit.role === "dps" && unit.elem === "fire") {
          hitTarget(unit, target, dmg, isSplash);
          state.effects.push({ lane: unit.lane, x: to.x, y: to.y, color: "#ff304d", age: 0, kind: "fire" });
        } else {
          state.shots.push({
            lane: unit.lane,
            fromX: from.x,
            fromY: from.y,
            x: from.x,
            y: from.y,
            toX: to.x,
            toY: to.y,
            target,
            unitId: unit.id,
            elem: unit.role === "dps" ? unit.elem : "special",
            dmg,
            splash: isSplash,
            color: unitEffectColor(unit),
            life: 0
          });
        }
      });

      updateShots(dt);
      state.effects.forEach((effect) => effect.age += dt);
      state.effects = state.effects.filter((effect) => effect.age < .45);
      pruneDamageEvents();
      state.mobs = state.mobs.filter((mob) => mob.hp > 0);

      if (state.mobs.length >= 100) lose("잡몹이 100마리에 도달했습니다.");
      if (!bossRounds.includes(state.round) && state.wave?.remaining === 0 && state.mobs.length === 0) {
        settleRoundTime(true);
        nextRound();
      }
      if (!state.gameOver && state.roundTime >= state.roundLimit) forceNextRoundByTime();
      if (state.boss && state.boss.hp <= 0 && !state.boss.dead) {
        state.boss.dead = true;
        state.coins.boss += 1;
        const unlockedSpeed = { 10: 3, 20: 4, 30: 5 }[state.boss.round];
        const unlocked = unlockedSpeed ? unlockMaxSpeed(unlockedSpeed) : false;
        toast("보스 처치 · 👑 1");
        if (unlocked) toast(`⏩ ${state.maxSpeed}배속 해금`);
        state.dirty = true;
        if (bossRounds.includes(state.round) && state.round < 30) {
          settleRoundTime(true);
          nextRound();
        } else if (state.boss.round === 30) {
          win();
        }
      }
    }

    function findTarget(unit) {
      if (unit.lane === "mob") return state.mobs[0] || null;
      if (state.boss && !state.boss.dead) return state.boss;
      return state.chest && !state.chest.dead ? state.chest : null;
    }

    function targetPoint(lane, target) {
      return lane === "boss" ? zigPath(canvases.boss, target.t) : boxPath(canvases.mob, target.t);
    }

    function recordDamage(unit, lane, amount) {
      if (!amount || amount <= 0) return;
      state.damageEvents.push({ unitId: unit.id, lane, amount, time: state.time });
    }

    function pruneDamageEvents() {
      const cutoff = state.time - 5;
      state.damageEvents = state.damageEvents.filter((event) => event.time >= cutoff);
    }

    function recentDps(unit, lane) {
      const cutoff = state.time - 5;
      const total = state.damageEvents.reduce((sum, event) => {
        return event.unitId === unit.id && event.lane === lane && event.time >= cutoff ? sum + event.amount : sum;
      }, 0);
      return total / 5;
    }

    function hitTarget(unit, target, dmg, splash) {
      if (!target || target.hp <= 0) return;
      let finalDamage = dmg;
      if (target === state.boss && state.boss?.round === 30 && state.mobs.some((mob) => mob.summoned)) finalDamage *= .2;
      const lane = target === state.boss || target === state.chest ? "boss" : "mob";
      target.hp -= finalDamage;
      recordDamage(unit, lane, finalDamage);
      if (splash) {
        const p = targetPoint(unit.lane, target);
        state.effects.push({ lane: unit.lane, x: p.x, y: p.y, color: unitEffectColor(unit), age: 0, kind: "splash" });
      }
      if (unit.lane === "mob" && splash) {
        state.mobs.slice(0, 5).forEach((mob) => {
          if (mob !== target) {
            const splashDamage = finalDamage * .35;
            mob.hp -= splashDamage;
            recordDamage(unit, "mob", splashDamage);
          }
        });
      }
      if (unit.lane === "mob" && target.hp <= 0) {
        unit.kills += 1;
        state.dirty = true;
      }
      if (target === state.chest && target.hp <= 0 && !target.dead) {
        target.dead = true;
        state.coins.silver += target.reward;
        toast(`보물상자 파괴 · 🥈 ${target.reward}`);
        if (state.round < 10) state.chest = makeChest(target.level + 1);
        state.dirty = true;
      }
    }

    function updateShots(dt) {
      state.shots.forEach((shot) => {
        shot.life += dt * 5.5;
        const p = Math.min(1, shot.life);
        shot.x = shot.fromX + (shot.toX - shot.fromX) * p;
        shot.y = shot.fromY + (shot.toY - shot.fromY) * p;
        if (p < 1 || shot.hit) return;
        shot.hit = true;
        const unit = state.units.find((item) => item.id === shot.unitId);
        if (!unit) return;
        hitTarget(unit, shot.target, shot.dmg, shot.splash);
      });
      state.shots = state.shots.filter((shot) => shot.life < 1.18);
    }

    function lose(text) {
      if (state.gameOver) return;
      state.gameOver = true;
      state.speed = 1;
      recordRun("패배");
      toast(`패배: ${text}`);
      renderStatic();
    }

    function win() {
      if (state.gameOver) return;
      state.gameOver = true;
      state.speed = 1;
      recordRun("클리어");
      toast("30라운드 클리어!");
      renderStatic();
    }

    function drawLane(lane) {
      const canvas = canvases[lane];
      const ctx = ctxs[lane];
      const { dpr } = fitCanvas(canvas);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.lineWidth = 5 * dpr;
      ctx.strokeStyle = lane === "mob" ? "rgba(98,185,255,.52)" : "rgba(255,212,96,.55)";
      ctx.setLineDash([12 * dpr, 12 * dpr]);
      if (lane === "mob") {
        const pad = Math.min(canvas.width, canvas.height) * .09;
        ctx.strokeRect(pad, pad, canvas.width - pad * 2, canvas.height - pad * 2);
      } else {
        drawZigPath(ctx, canvas);
      }
      ctx.setLineDash([]);
      drawGridGlow(ctx, canvas, lane);
      if (lane === "mob") drawMobs(ctx, canvas);
      else drawRightTarget(ctx, canvas);
      drawShots(ctx, lane);
      drawEffects(ctx, lane);
      ctx.restore();
    }

    function drawZigPath(ctx, canvas) {
      ctx.beginPath();
      for (let i = 0; i <= 90; i++) {
        const p = zigPath(canvas, i / 90);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }

    function drawGridGlow(ctx, canvas, lane) {
      ctx.globalAlpha = .11;
      ctx.fillStyle = lane === "mob" ? "#62b9ff" : "#ffd460";
      const layouts = lane === "mob" ? mobSlotLayout : bossSlotLayout;
      layouts.forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(canvas.width * x, canvas.height * y, 34, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function hpGauge(target) {
      const hp = Math.max(0, target.hp);
      const maxHp = Math.max(1, target.maxHp);
      if (maxHp < 5000) return { ratio: hp / maxHp, layers: 1, remainingLayers: 1 };
      const layers = target.elite
        ? Math.min(28, Math.max(8, Math.ceil(maxHp / 2500)))
        : maxHp >= 100000 ? 10 : 5;
      const chunk = maxHp / layers;
      if (hp <= 0) return { ratio: 0, layers, remainingLayers: 0 };
      const currentChunkHp = hp - Math.floor((hp - .0001) / chunk) * chunk;
      return {
        ratio: Math.max(.02, Math.min(1, currentChunkHp / chunk)),
        layers,
        remainingLayers: Math.max(1, Math.ceil(hp / chunk))
      };
    }

    function drawHpGauge(ctx, x, y, width, height, target, color) {
      const gauge = hpGauge(target);
      ctx.fillStyle = "rgba(0,0,0,.64)";
      ctx.fillRect(x, y, width, height);
      ctx.fillStyle = color;
      ctx.fillRect(x, y, width * gauge.ratio, height);
      if (gauge.layers > 1) {
        ctx.fillStyle = "rgba(255,255,255,.45)";
        for (let i = 1; i < gauge.layers; i++) {
          const tickX = x + width * i / gauge.layers;
          ctx.fillRect(tickX - .5, y, 1, height);
        }
        const scale = window.devicePixelRatio || 1;
        ctx.font = `900 ${Math.max(7, height * .82)}px system-ui, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineWidth = 2 * scale;
        ctx.strokeStyle = "rgba(0,0,0,.8)";
        ctx.fillStyle = "#fff";
        const label = `x${gauge.remainingLayers}`;
        ctx.strokeText(label, x + width / 2, y + height / 2 + .5 * scale);
        ctx.fillText(label, x + width / 2, y + height / 2 + .5 * scale);
      }
    }

    function drawMobHpRing(ctx, x, y, mob, color) {
      const scale = window.devicePixelRatio || 1;
      const gauge = hpGauge(mob);
      const radius = (mob.size + 3) * scale;
      ctx.lineWidth = 2.4 * scale;
      ctx.strokeStyle = "rgba(0,0,0,.58)";
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, radius, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * gauge.ratio);
      ctx.stroke();
      if (gauge.layers > 1) {
        const label = `x${gauge.remainingLayers}`;
        const w = 19 * scale;
        const h = 10 * scale;
        const labelY = y - radius - 9 * scale;
        ctx.fillStyle = "rgba(0,0,0,.72)";
        ctx.fillRect(x - w / 2, labelY - h / 2, w, h);
        ctx.font = `900 ${7 * scale}px system-ui, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#fff";
        ctx.fillText(label, x, labelY + .5 * scale);
      }
    }

    function drawMobs(ctx, canvas) {
      state.mobs.forEach((mob) => {
        const p = boxPath(canvas, mob.t);
        const e = mob.elem ? elem(mob.elem) : { color: "#d4d9e3" };
        const scale = window.devicePixelRatio || 1;
        ctx.beginPath();
        ctx.fillStyle = e.color;
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 14;
        ctx.arc(p.x, p.y, mob.size * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        drawMobHpRing(ctx, p.x, p.y, mob, mob.elite ? "#ffdf6e" : "#fff");
      });
    }

    function drawRightTarget(ctx, canvas) {
      const target = state.boss && !state.boss.dead ? state.boss : state.chest && !state.chest.dead ? state.chest : null;
      if (!target) return;
      const p = zigPath(canvas, target.t);
      const isBoss = !!(state.boss && !state.boss.dead);
      const color = isBoss ? elem(state.boss.element).color : "#ffd460";
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(state.time * 2);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 22;
      if (isBoss) {
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = i / 8 * Math.PI * 2;
          const r = i % 2 ? 28 : 42;
          ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(-34, -28, 68, 56);
        ctx.fillStyle = "rgba(0,0,0,.28)";
        ctx.fillRect(-6, -28, 12, 56);
      }
      ctx.restore();
      drawHpGauge(ctx, p.x - 48, p.y + 48, 96, 11, target, color);
    }

    function drawShots(ctx, lane) {
      const scale = window.devicePixelRatio || 1;
      state.shots.filter((shot) => shot.lane === lane).forEach((shot) => {
        ctx.shadowColor = shot.color;
        ctx.shadowBlur = 12;
        if (shot.elem === "grass") {
          ctx.fillStyle = shot.color;
          ctx.beginPath();
          ctx.arc(shot.x, shot.y, 8 * scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "rgba(220,255,230,.8)";
          ctx.lineWidth = 2 * scale;
          ctx.stroke();
        } else {
          ctx.strokeStyle = shot.color;
          ctx.lineWidth = 4 * scale;
          ctx.beginPath();
          ctx.moveTo(shot.fromX, shot.fromY);
          ctx.lineTo(shot.x, shot.y);
          ctx.stroke();
        }
        ctx.shadowBlur = 0;
      });
    }

    function drawEffects(ctx, lane) {
      const scale = window.devicePixelRatio || 1;
      state.effects.filter((effect) => effect.lane === lane).forEach((effect) => {
        const p = effect.age / .45;
        ctx.save();
        if (effect.kind === "splash") {
          ctx.globalAlpha = 1 - p;
          ctx.strokeStyle = effect.color;
          ctx.fillStyle = "rgba(255,255,255,.08)";
          ctx.lineWidth = 5 * scale;
          ctx.shadowColor = effect.color;
          ctx.shadowBlur = 28;
          ctx.beginPath();
          ctx.arc(effect.x, effect.y, (24 + p * 58) * scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          for (let i = 0; i < 10; i++) {
            const a = i / 10 * Math.PI * 2 + p * 1.8;
            const r = (18 + p * 48) * scale;
            ctx.beginPath();
            ctx.arc(effect.x + Math.cos(a) * r, effect.y + Math.sin(a) * r, 3.5 * scale, 0, Math.PI * 2);
            ctx.fillStyle = effect.color;
            ctx.fill();
          }
        } else {
          ctx.globalAlpha = 1 - p;
          ctx.strokeStyle = effect.color;
          ctx.fillStyle = "rgba(255,48,77,.18)";
          ctx.lineWidth = 4 * scale;
          ctx.shadowColor = effect.color;
          ctx.shadowBlur = 22;
          ctx.beginPath();
          ctx.arc(effect.x, effect.y, (18 + p * 26) * scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
        ctx.restore();
      });
    }

    function renderStatic() {
      updateHud();
      renderSlots("mob", $("mobSlots"), 20);
      renderSlots("boss", $("bossSlots"), 20);
      renderBench();
      renderUpgrades();
      renderDps();
      $("pickElements").style.display = state.pendingPick ? "grid" : "none";
      $("app").classList.toggle("sell-mode", state.sellMode);
      $("sellBtn").classList.toggle("active", state.sellMode);
      $("startScreen").hidden = state.started;
      if (!$("recordsPanel").hidden) renderRecords();
      state.dirty = false;
    }

    function renderDynamic() {
      updateHud();
      renderDps();
    }

    function updateHud() {
      $("roundPill").textContent = `R ${state.round} / 30`;
      const attr = state.roundElement ? `${elem(state.roundElement).icon} ${elem(state.roundElement).name}` : "무";
      $("attrPill").textContent = `속성 ${attr}${state.affix ? ` · ${state.affix.label}` : ""}`;
      $("coinPill").textContent = coinText();
      const mobDanger = state.mobs.length >= 90;
      $("limitPill").textContent = `🌀 ${state.mobs.length} / 100`;
      $("limitPill").classList.toggle("danger", mobDanger);
      $("mobLane").classList.toggle("danger", mobDanger);
      $("speedBtn").textContent = `⏩ ${state.speed}x`;
      $("speedBtn").title = `해금 최대 ${state.maxSpeed}x`;
      $("mobCount").textContent = `${mobDanger ? "⚠️ " : ""}${state.mobs.length}마리 · 잔여 ${state.wave?.remaining || 0} · ⏳ ${formatTime(state.roundLimit - state.roundTime)}초 · 저축 ${formatTime(state.timeBank)}초`;
      if (state.boss && !state.boss.dead) {
        const shield = state.boss.round === 30 && state.mobs.some((mob) => mob.summoned) ? " · 실드 80%" : "";
        $("bossInfo").textContent = `${state.boss.round}R 보스 ${elem(state.boss.element).icon} HP ${formatHp(state.boss.hp)} / ${formatHp(state.boss.maxHp)}${shield}`;
      } else if (state.chest && !state.chest.dead) $("bossInfo").textContent = `상자 Lv.${state.chest.level} HP ${formatHp(state.chest.hp)} / ${formatHp(state.chest.maxHp)} · 🥈 ${state.chest.reward}`;
      else $("bossInfo").textContent = state.round < 10 ? "상자 없음" : "보스 없음";
      const preview = state.round >= 5 ? ` · 보스예고 ${state.bossPreview.map((boss) => `${boss.round}R ${elem(boss.element).icon}`).join(" ")}` : "";
      $("statusText").textContent = state.gameOver
        ? "게임 종료. 재시작으로 다시 도전하세요."
        : !state.started
          ? "게임 시작 버튼을 눌러 1라운드를 시작하세요."
        : mobDanger
          ? "⚠️ 위험: 잡몹이 90마리를 넘었습니다. 왼쪽 라인 딜러를 더 배치하세요."
        : state.sellMode
          ? "판매선택 중입니다. 유닛을 탭하면 계속 판매됩니다."
        : state.pendingPick
          ? `${state.pendingPick.label}: 불/물/풀 중 하나를 고르세요.`
          : selectedUnit()
            ? selectedUnitText()
          : `라운드 웨이브는 전체 속성 하나로 고정됩니다.${preview}`;
    }

    function renderSlots(lane, root, count) {
      root.innerHTML = "";
      for (let i = 0; i < count; i++) {
        const button = document.createElement("button");
        const unit = slotUnit(lane, i);
        button.className = `slot${state.selected && !unit ? " ready" : ""}${unit?.id === state.selected ? " selected" : ""}`;
        button.setAttribute("aria-label", `${lane}-${i + 1}`);
        button.onclick = () => placeUnit(lane, i);
        if (unit) button.appendChild(unitNode(unit));
        root.appendChild(button);
      }
    }

    function unitNode(unit) {
      const t = tier(unit.tier);
      const e = elem(unit.elem);
      const node = document.createElement("div");
      node.className = `unit tier-${unit.tier}`;
      if (unit.role !== "dps") node.classList.add("special-unit");
      node.dataset.tier = t.label;
      const icon = document.createElement("span");
      icon.className = "unit-emoji";
      icon.textContent = unit.role === "dps" ? e.icon : specialEffectIcon(unit.role);
      node.appendChild(icon);
      if (unit.elements?.length > 1) {
        const marks = document.createElement("span");
        marks.className = "unit-elements";
        marks.textContent = unit.elements.map((key) => elem(key).icon).join("");
        node.appendChild(marks);
      }
      node.title = `${t.name} ${unit.role === "dps" ? e.name : specialRoleLabel(unit.role)} · ${unit.role} · 킬 ${unit.kills}`;
      return node;
    }

    function renderBench() {
      const root = $("bench");
      root.innerHTML = "";
      const units = state.units.filter((unit) => unit.lane === "bench");
      for (let i = 0; i < 10; i++) {
        const unit = units[i];
        const button = document.createElement("button");
        button.className = `bench-card${unit?.id === state.selected ? " selected" : ""}`;
        button.setAttribute("aria-label", unit ? `${tier(unit.tier).name} ${unit.role === "dps" ? elem(unit.elem).name : specialRoleLabel(unit.role)}` : "빈 대기석");
        button.onclick = () => {
          if (!unit) {
            const selected = selectedUnit();
            if (!selected || selected.lane === "bench") return;
            selected.lane = "bench";
            selected.slot = null;
            state.selected = selected.id;
            state.sellMode = false;
            state.dirty = true;
            toast("대기석으로 복귀");
            renderStatic();
            return;
          }
          if (state.sellMode) return sellUnit(unit);
          state.selected = unit.id;
          renderStatic();
        };
        if (unit) button.appendChild(unitNode(unit));
        else button.innerHTML = `<span class="small">빈칸</span>`;
        root.appendChild(button);
      }
    }

    function renderUpgrades() {
      $("upgrades").innerHTML = elems.map((item) => {
        const level = state.upgrades[item.key];
        const cost = Math.floor(level / 3) + 1;
        return `<button class="upgrade" data-up="${item.key}">
          <strong>${item.icon} ${item.name} Lv.${level}</strong>
          <span class="small">비용 🥈 ${cost} · 레벨당 15% 복리</span>
        </button>`;
      }).join("");
      document.querySelectorAll("[data-up]").forEach((button) => {
        button.onclick = () => upgrade(button.dataset.up);
      });
    }

    function renderDps() {
      const rowsFor = (lane) => state.units.filter((unit) => unit.lane !== "bench").map((unit) => ({
        unit,
        dps: Math.round(recentDps(unit, lane))
      })).filter((row) => row.dps > 0).sort((a, b) => b.dps - a.dps).slice(0, 6);
      const mobRows = rowsFor("mob");
      const bossRows = rowsFor("boss");
      const max = Math.max(1, ...mobRows.map((row) => row.dps), ...bossRows.map((row) => row.dps));
      const section = (title, rows) => rows.length
        ? `<div class="small">${title}</div>` + rows.map(({ unit, dps }) => {
          const t = tier(unit.tier);
          const label = unitDisplayLabel(unit);
          const width = Math.max(5, dps / max * 100);
          return `<div class="dps-row"><span>${t.label} ${label}</span><span class="dps-track"><span class="dps-fill" style="width:${width}%"></span></span><span>${dps}</span></div>`;
        }).join("")
        : `<div class="small">${title} · 최근 딜 없음</div>`;
      $("dpsList").innerHTML = state.units.some((unit) => unit.lane !== "bench")
        ? section("일반몹 최근 DPS", mobRows) + section("보스/상자 최근 DPS", bossRows)
        : `<div class="small">필드에 유닛을 배치하면 최근 실제 DPS가 표시됩니다.</div>`;
    }

    function recordText(record) {
      const up = record.upgrades || {};
      return `<div class="record-row">
        <div class="record-round">R ${record.round}<br>${record.result}</div>
        <div>뽑기 ${record.totalDraws} · 전설 ${record.legendDraws} · 다이아 ${record.diamondDraws}<br>
        업글 🔥${up.fire || 0} 💧${up.water || 0} 🌿${up.grass || 0}</div>
      </div>`;
    }

    function renderRecords() {
      const records = recentRecords();
      $("recordsPanel").innerHTML = records.length
        ? `<strong>최근 5판 기록</strong>${records.map(recordText).join("")}`
        : `<strong>최근 5판 기록</strong><div class="small">아직 저장된 기록이 없습니다.</div>`;
    }

    function toggleRecords() {
      const panel = $("recordsPanel");
      const open = panel.hidden;
      if (open) renderRecords();
      panel.hidden = !open;
      $("recordsBtn").classList.toggle("active", open);
    }

    function restartGame() {
      if (shouldRecordRestart()) recordRun("재시작");
      reset(true);
      renderRecords();
    }

    function loop(now) {
      const raw = Math.min(.05, (now - state.last) / 1000);
      state.last = now;
      if (state.started) update(raw * state.speed);
      drawLane("mob");
      drawLane("boss");
      if (state.dirty) renderStatic();
      else renderDynamic();
      requestAnimationFrame(loop);
    }

    $("drawBtn").onclick = drawUnit;
    $("sellBtn").onclick = toggleSellMode;
    $("deployLeftBtn").onclick = deployBenchToLeft;
    $("recallLowBtn").onclick = recallLowToBench;
    $("moveTopLeftBtn").onclick = () => moveTopUnitsToLane("mob");
    $("moveTopRightBtn").onclick = () => moveTopUnitsToLane("boss");
    $("sellBenchBtn").onclick = sellAllBench;
    $("restartBtn").onclick = restartGame;
    $("startBtn").onclick = () => reset(true);
    $("recordsBtn").onclick = toggleRecords;
    $("speedBtn").onclick = () => {
      state.speed = state.speed >= state.maxSpeed ? 1 : state.speed + 1;
      renderStatic();
    };
    $("bossPick").onclick = () => buyPick("boss", "diamond", "다이아 픽");
    $("diamondPick").onclick = () => buyPick("diamond", "gold", "골드 픽");
    $("goldPick").onclick = () => buyPick("gold", "silver", "실버 픽");
    $("splitBoss").onclick = () => splitCoin("boss");
    $("splitDiamond").onclick = () => splitCoin("diamond");
    $("splitGold").onclick = () => splitCoin("gold");
    $("buySlow").onclick = () => buySpecial("slow");
    $("buyStun").onclick = () => buySpecial("stun");
    $("buySplash").onclick = () => buySpecial("buff");
    document.querySelectorAll("[data-pick-element]").forEach((button) => {
      button.onclick = () => finishPick(button.dataset.pickElement);
    });
    window.addEventListener("resize", renderStatic);

    reset(false);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
